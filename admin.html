<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FestiBites — Secure Admin Portal</title>
  <link rel="icon" type="image/svg+xml" href="./icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --ink:#3a1b0f;
      --teal:#f26a21;
      --coral:#e85d04;
      --cream:#fffaf7;
      --muted:#765f54;
      --line:#f2ddd0;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(102,54,28,.08);width:100%;max-width:540px;overflow:hidden}
    .card-header{background:linear-gradient(135deg,#ff8a3d,#e85d04);color:#fff;padding:28px 24px;text-align:center}
    .card-header h1{font-size:26px;margin-bottom:6px}
    .card-header p{opacity:.95;font-size:13px}
    .card-body{padding:28px}
    .form-group{margin-bottom:16px}
    label{display:block;font-weight:800;font-size:13px;margin-bottom:6px;color:var(--ink)}
    input,select,textarea{width:100%;border:1px solid #ead8ce;border-radius:12px;padding:12px;font:inherit;font-size:14px;outline:none;background:#fff}
    textarea{resize:vertical;min-height:100px}
    input:focus,select:focus,textarea:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(242,106,33,.10)}
    .btn{border:0;background:linear-gradient(135deg,#ff8a3d,#e85d04);color:#fff;border-radius:12px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;width:100%;box-shadow:0 8px 20px rgba(232,93,4,.22);transition:.2s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(232,93,4,.30)}
    .back-link{display:block;text-align:center;margin-top:20px;color:var(--muted);text-decoration:none;font-weight:700;font-size:13px}
    .back-link:hover{color:var(--coral)}
    #loginSection,#adminPanel{display:none}
  </style>
</head>
<body>

  <div class="card">
    <!-- Login Section -->
    <div id="loginSection" style="display:block;">
      <div class="card-header">
        <h1>🔒 Admin Portal</h1>
        <p>Enter your secret administrator password to manage FestiBites</p>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label for="adminPass">Admin Password</label>
          <input id="adminPass" type="password" placeholder="Enter admin password..." onkeydown="if(event.key==='Enter') verifyAdmin()">
        </div>
        <button class="btn" onclick="verifyAdmin()">Access Admin Panel</button>
        <p id="loginError" style="color:var(--coral);font-weight:800;font-size:13px;text-align:center;margin-top:12px;display:none;">Incorrect password. Please try again.</p>
        <a class="back-link" href="./index.html">← Back to FestiBites Website</a>
      </div>
    </div>

    <!-- Admin Panel Dashboard -->
    <div id="adminPanel">
      <div class="card-header">
        <h1>🍳 FestiBites Publisher</h1>
        <p>Add new recipes or update the Recipe of the Day instantly!</p>
      </div>
      <div class="card-body" style="max-height:80vh;overflow-y:auto;">
        <div class="form-group">
          <label for="rName">Recipe Name *</label>
          <input id="rName" type="text" placeholder="e.g. Special Malabar Biryani">
        </div>
        <div style="display:flex;gap:12px;" class="form-group">
          <div style="flex:1;">
            <label for="rCategory">Category *</label>
            <select id="rCategory">
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
              <option value="Biryani">Biryani</option>
              <option value="Kerala Foods">Kerala Foods</option>
              <option value="Indian">Indian</option>
              <option value="Chinese">Chinese</option>
              <option value="Arabic">Arabic</option>
              <option value="Snacks">Snacks</option>
              <option value="Desserts">Desserts</option>
              <option value="Beverages">Beverages</option>
              <option value="Fast Food">Fast Food</option>
            </select>
          </div>
          <div style="flex:1;">
            <label for="rMinutes">Cooking Time (Mins) *</label>
            <input id="rMinutes" type="number" value="30">
          </div>
        </div>
        <div class="form-group">
          <label for="rDesc">Short Description *</label>
          <input id="rDesc" type="text" placeholder="e.g. A rich aromatic rice dish with spiced chicken...">
        </div>
        <div class="form-group">
          <label for="rIngredients">Ingredients (comma separated) *</label>
          <textarea id="rIngredients" placeholder="e.g. 2 cups basmati rice, 500g chicken, 2 onions, 1 tsp ginger-garlic paste, 3 tbsp ghee"></textarea>
        </div>
        <div class="form-group">
          <label for="rSteps">Step-by-Step Instructions (one step per line) *</label>
          <textarea id="rSteps" placeholder="Step 1: Marinate chicken with yogurt and spices...&#10;Step 2: Parboil basmati rice with whole spices...&#10;Step 3: Layer and dum cook for 20 minutes..."></textarea>
        </div>
        <div class="form-group" style="background:#fff7f1;padding:12px 16px;border-radius:12px;border:1px solid var(--line);">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:0;">
            <input id="rSetRotd" type="checkbox" style="width:18px;height:18px;accent-color:var(--coral);">
            <span style="font-weight:900;color:var(--coral);">⭐ Set as Recipe of the Day on Front Page</span>
          </label>
        </div>
        <button class="btn" onclick="publishRecipe()">Publish Recipe Now 🚀</button>
        <p id="publishSuccess" style="color:var(--teal);font-weight:900;font-size:14px;text-align:center;margin-top:12px;display:none;">🎉 Recipe published successfully!</p>
        <a class="back-link" href="./index.html">← Return to FestiBites Home</a>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = "https://ajvzgxfadnkimcilvnfs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqdnpneGZhZG5raW1jaWx2bmZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM4MDAwMDAsImV4cCI6MjA1OTM3NjAwMH0.supabase_placeholder_key_replace_if_needed";
let supabaseClient = null;
if (typeof supabase !== "undefined") {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// Simple secure admin password (Change 'festibites2026' to whatever password you want)
const ADMIN_SECRET = "festibites2026";

function verifyAdmin(){
  const pass = document.getElementById("adminPass").value.trim();
  if(pass === ADMIN_SECRET){
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    localStorage.setItem("festibites_admin_auth", "true");
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}

// Auto-login if previously authenticated in this browser session
window.addEventListener("DOMContentLoaded", () => {
  if(localStorage.getItem("festibites_admin_auth") === "true"){
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
  }
});

async function publishRecipe(){
  const name = document.getElementById("rName").value.trim();
  const category = document.getElementById("rCategory").value;
  const minutes = Number(document.getElementById("rMinutes").value) || 25;
  const description = document.getElementById("rDesc").value.trim() || `A delicious ${name} recipe with ingredients and step-by-step instructions.`;
  const rawIng = document.getElementById("rIngredients").value.trim();
  const rawSteps = document.getElementById("rSteps").value.trim();
  const setRotd = document.getElementById("rSetRotd").checked;

  if(!name || !rawIng || !rawSteps || !description){
    alert("Please fill in all required recipe fields.");
    return;
  }

  const ingredients = rawIng.split(",").map(s => s.trim()).filter(Boolean);
  const steps = rawSteps.split("\n").map(s => s.trim()).filter(Boolean);

  const newRecipe = {
    name,
    category,
    minutes,
    servings: 2,
    difficulty: "Easy",
    description,
    ingredients,
    steps
  };

  if(supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from('recipes')
        .insert([newRecipe]);
      if(error) {
        alert("Database error: " + error.message);
        return;
      }
    } catch(e) {
      console.error(e);
      alert("Failed to connect to Supabase database.");
      return;
    }
  }

  if(setRotd) {
    localStorage.setItem("festibites_custom_rotd_title", name);
  }

  const successEl = document.getElementById("publishSuccess");
  successEl.style.display = "block";
  setTimeout(() => { successEl.style.display = "none"; }, 4000);

  // Clear form
  document.getElementById("rName").value = "";
  document.getElementById("rDesc").value = "";
  document.getElementById("rIngredients").value = "";
  document.getElementById("rSteps").value = "";
  document.getElementById("rSetRotd").checked = false;
}
</script>
</body>
</html>
