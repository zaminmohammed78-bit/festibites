name: Generate FestiBites PNG icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'festibites-logo.jpg'
      - '.github/workflows/generate-icons.yml'
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG icons from the exact logo
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open("festibites-logo.jpg").convert("RGB")
          for filename, size in [
              ("icon-192.png", 192),
              ("icon-512.png", 512),
              ("apple-touch-icon.png", 180),
          ]:
              src.resize((size, size), Image.Resampling.LANCZOS).save(filename, "PNG", optimize=True)
          with open("icon.svg", "w", encoding="utf-8") as f:
              f.write('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><image href="./icon-512.png" width="512" height="512"/></svg>')
          PY
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon.svg icon-192.png icon-512.png apple-touch-icon.png
          git diff --cached --quiet || git commit -m 'Generate PWA icons from FestiBites logo'
          git push
