<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a4d"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3a1b0f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="112" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Outer Flame Circle -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="url(#bgGrad)" stroke-width="32" stroke-linecap="round"/>

  <!-- Flame Silhouette -->
  <path d="M256 100c-25 35-50 65-50 100 0 28 22 50 50 50s50-22 50-50c0-35-25-65-50-100z" fill="#e85d04"/>

  <!-- Whisk & Spatula Cooking Icons -->
  <g transform="translate(160, 160) scale(3.5)">
    <!-- Whisk -->
    <path d="M12 2v20M8 6h8M9 10h6M10 14h4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Spatula -->
    <path d="M22 17l-5-5M17 12l3-3a2.82 2.82 0 00-4-4l-3 3-4 4 4 4 4-4z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
