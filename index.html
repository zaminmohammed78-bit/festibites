<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FestiBites — Scheduled Maintenance</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <style>
    :root{
      --ink:#3a1b0f;
      --coral:#e85d04;
      --cream:#fffaf7;
      --muted:#765f54;
      --line:#f2ddd0;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .maintenance-card{background:#fff;border-radius:28px;border:1px solid var(--line);box-shadow:0 18px 45px rgba(102,54,28,.12);max-width:520px;width:100%;padding:45px 32px;text-align:center}
    .badge{display:inline-block;background:#fff3eb;color:var(--coral);font-weight:800;padding:8px 16px;border-radius:99px;font-size:13px;margin-bottom:20px;text-transform:uppercase;letter-spacing:1px}
    h1{font-size:32px;color:var(--ink);margin-bottom:12px;letter-spacing:-1px}
    p{color:var(--muted);font-size:16px;line-height:1.7;margin-bottom:28px}
    .admin-link{display:inline-block;padding:12px 24px;background:var(--coral);color:#fff;text-decoration:none;font-weight:900;border-radius:14px;box-shadow:0 8px 22px rgba(232,93,4,.25);transition:transform .2s}
    .admin-link:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <div class="maintenance-card">
    <div class="badge">⚙️ Scheduled Maintenance</div>
    <h1>We’re Upgrading FestiBites</h1>
    <p>Our kitchen is currently undergoing scheduled maintenance and updates to bring you an extraordinary, bug-free recipe experience. Please check back shortly!</p>
    <a class="admin-link" href="./admin.html">🔐 Admin Portal Login</a>
  </div>
</body>
</html>
